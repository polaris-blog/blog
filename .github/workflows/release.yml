name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.0.0)"
        required: true
        type: string
      description:
        description: "Release description"
        required: false
        type: string
        default: ""
      publish_release:
        description: "Publish to GitHub Release?"
        required: true
        type: boolean
        default: false
      push_docker:
        description: "Push Docker image to GHCR?"
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.26"
  UPX_VERSION: "4.2.4"

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            upx: true
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            upx: true
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            upx: false
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            upx: false
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
            upx: true
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe
            upx: false

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${{ inputs.version }}" -o polaris${{ matrix.ext }} ./cmd/polaris
          echo "Original size: $(ls -lh polaris${{ matrix.ext }} | awk '{print $5}')"

      - name: Install UPX
        if: matrix.upx == true
        run: |
          wget -q https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-amd64_linux.tar.xz
          tar -xf upx-${{ env.UPX_VERSION }}-amd64_linux.tar.xz
          sudo cp upx-${{ env.UPX_VERSION }}-amd64_linux/upx /usr/local/bin/
          upx --version

      - name: Compress binary with UPX
        if: matrix.upx == true
        run: |
          upx --best polaris${{ matrix.ext }} || echo "UPX compression skipped"
          echo "Final size: $(ls -lh polaris${{ matrix.ext }} | awk '{print $5}')"

      - name: Rename binary
        run: mv polaris${{ matrix.ext }} polaris-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: polaris-${{ matrix.suffix }}
          path: polaris-${{ matrix.suffix }}${{ matrix.ext }}
          retention-days: 7

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: polaris-linux-amd64
          path: binaries/amd64

      - name: Download linux-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: polaris-linux-arm64
          path: binaries/arm64

      - name: Prepare binaries
        run: |
          mv binaries/amd64/polaris-linux-amd64 binaries/amd64/polaris
          mv binaries/arm64/polaris-linux-arm64 binaries/arm64/polaris
          chmod +x binaries/*/polaris

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push_docker == true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push_docker }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.publish_release == true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Polaris ${{ inputs.version }}
          body: ${{ inputs.description }}
          files: |
            artifacts/*
          draft: false
          prerelease: false
