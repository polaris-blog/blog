name: Release

# Triggered by pushing a version tag:  git tag v1.0.0 && git push origin v1.0.0
#
# One pipeline, one build per target:
#   1. build matrix — 5 targets (Linux/Windows x86_64+arm64, macOS arm64),
#      UPX where supported, binaries attached raw to the GitHub release
#   2. the two Linux builds are additionally packed into multi-arch GHCR
#      images by reusing the prebuilt binary (Dockerfile.release — no
#      compilation inside Docker), then merged into one manifest list
#
# Release assets are the raw binaries (no tar/zip wrappers); SHA256SUMS is
# computed over the exact files being released.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  BIN: polaris

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — static musl binaries, run anywhere without dependencies.
          # These two also become the container images (linux/amd64+arm64).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/amd64
            upx: true
            docker: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux/arm64
            upx: true
            docker: true
          # macOS — Apple Silicon native runner (macos-14+). Intel macOS is
          # not built: macos-13 runners are no longer available. UPX is
          # intentionally skipped: compressed Mach-O binaries are killed by
          # modern macOS code signing/runtime protections.
          - target: aarch64-apple-darwin
            os: macos-14
            upx: false
            docker: false
          # Windows — ARM64 cross-compiles on the x64 runner (the windows
          # image ships the MSVC ARM64 toolset; libsqlite3-sys builds from
          # source through cc). UPX: only x64 — keep the ARM64 PE as-is.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            upx: true
            docker: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            upx: false
            docker: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install UPX (Windows)
        if: matrix.upx && runner.os == 'Windows'
        run: choco install upx --no-progress

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Compress binary with UPX
        if: matrix.upx
        run: upx --best --lzma target/${{ matrix.target }}/release/${{ env.BIN }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Stage release binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          NAME="${BIN}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${BIN}" "${NAME}"
          echo "FILE=${NAME}" >> "$GITHUB_ENV"

      - name: Stage release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${env:BIN}-${env:GITHUB_REF_NAME}-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/${env:BIN}.exe" $name
          "FILE=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.FILE }}
          if-no-files-found: error

      # ---- Container image (Linux targets only): assemble the runtime image
      # ---- from the prebuilt binary — seconds, not another full compile.
      - name: Log in to GHCR
        if: matrix.docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # PAT with write:packages (repo secret) — sidesteps the
          # GITHUB_TOKEN package-permission quirks on GHCR.
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        if: matrix.docker
        uses: docker/setup-buildx-action@v3

      - name: Stage container image context
        if: matrix.docker
        run: |
          mkdir image
          cp "target/${{ matrix.target }}/release/${BIN}" image/polaris
          cp -r themes plugins image/
          cp polaris.toml.example image/
          cp Dockerfile.release image/Dockerfile

      - name: Build and push image by digest
        id: image
        if: matrix.docker
        uses: docker/build-push-action@v6
        with:
          context: ./image
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          # Push by digest: the ref must NOT carry a tag — tagged refs
          # conflict with push-by-digest mode. Version/latest tags are
          # applied by the merge job's imagetools create.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        if: matrix.docker
        run: |
          d="${{ steps.image.outputs.digest }}"
          mkdir -p /tmp/digests
          echo "${d#sha256:}" > "/tmp/digests/${d#sha256:}"

      - uses: actions/upload-artifact@v4
        if: matrix.docker
        with:
          name: image-digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error

  images:
    name: merge image manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create manifest list (version + latest)
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE }}"
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCES=""
          for d in *; do
            SOURCES="$SOURCES ${IMAGE}@sha256:$d"
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" $SOURCES
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Validate binaries and compute checksums
        run: |
          cd artifacts
          ls -la
          # Fail fast instead of attaching empty assets.
          for f in polaris-*; do
            [ -s "$f" ] || { echo "EMPTY BINARY: $f"; exit 1; }
          done
          sha256sum polaris-* > SHA256SUMS

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/polaris-*
            artifacts/SHA256SUMS
          # A moved tag re-runs the pipeline: replace same-named assets
          # instead of failing the upload.
          overwrite_files: true
          generate_release_notes: true
          body: |
            The first stable release of Polaris — a single-binary blog engine in Rust.

            - **Single static binary** — Linux builds are fully static (musl); no runtime dependencies.
            - **Multi-database** — SQLite (WAL, zero-config), MySQL, PostgreSQL with automatic migrations.
            - **Server-rendered admin** — posts, pages, terms, comment moderation, users, navigation, scheduling.
            - **Media library** — magic-byte validation, dedup, thumbnails, SVG sanitization.
            - **Sandboxed plugins** — Rhai scripts: hooks, routes, filters, jobs; no filesystem or network.
            - **Full-text search** — FTS5 / tsquery / boolean-mode providers per dialect.
            - **Backups** — checksummed archives, verified restores with pre-restore snapshots.
            - **Themes** — hot switching, embedded fallback, syntax-highlighted code blocks.
            - **Containers** — multi-arch images at `ghcr.io/polaris-blog/blog:1.0.0`.

            Install: download the binary for your target, `chmod +x`, verify against `SHA256SUMS`, run `./polaris serve`.
