name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.0.0)"
        required: true
        type: string
      description:
        description: "Release description"
        required: false
        type: string
        default: ""
      publish_release:
        description: "Publish to GitHub Release?"
        required: true
        type: boolean
        default: false
      push_docker:
        description: "Push Docker image to GHCR?"
        required: true
        type: boolean
        default: false
      compress_binaries:
        description: "Compress binaries with UPX?"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.23"

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            upx: true
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            upx: true
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            upx: false
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            upx: false
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
            upx: true
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe
            upx: true

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${{ inputs.version }}" -o polaris${{ matrix.ext }} ./cmd/polaris
          echo "Original size: $(ls -lh polaris${{ matrix.ext }} | awk '{print $5}')"

      - name: Install UPX
        if: inputs.compress_binaries == true && matrix.upx == true
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Compress binary with UPX
        if: inputs.compress_binaries == true && matrix.upx == true
        run: |
          upx --best --lzma polaris${{ matrix.ext }}
          echo "Compressed size: $(ls -lh polaris${{ matrix.ext }} | awk '{print $5}')"

      - name: Create archive
        run: |
          mkdir -p release
          cp polaris${{ matrix.ext }} release/
          cp -r web release/
          cp -r plugins release/
          if [ -f config.example.yaml ]; then cp config.example.yaml release/; fi
          if [ -f README.md ]; then cp README.md release/; fi
          cd release
          tar -czvf ../polaris-${{ matrix.suffix }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: polaris-${{ matrix.suffix }}
          path: polaris-${{ matrix.suffix }}.tar.gz
          retention-days: 7

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push_docker == true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push_docker }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.publish_release == true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Generate release notes
        id: notes
        run: |
          cat << 'EOF' > release_notes.md
          ${{ inputs.description }}

          ## Downloads

          | Platform | Architecture | File |
          |----------|-------------|------|
          | Linux | x86_64 | polaris-linux-amd64.tar.gz |
          | Linux | ARM64 | polaris-linux-arm64.tar.gz |
          | macOS | x86_64 | polaris-darwin-amd64.tar.gz |
          | macOS | ARM64 (M1/M2) | polaris-darwin-arm64.tar.gz |
          | Windows | x86_64 | polaris-windows-amd64.tar.gz |
          | Windows | ARM64 | polaris-windows-arm64.tar.gz |

          ## Docker

          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ inputs.version }}
          ```
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Polaris ${{ inputs.version }}
          body_path: release_notes.md
          files: |
            artifacts/*
          draft: false
          prerelease: false
