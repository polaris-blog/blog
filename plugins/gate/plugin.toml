id = "gate"
name = "Entry Gate"
version = "1.0.0"
author = "Polaris"
description = "Cloudflare-style proof-of-work human verification before visitors enter the blog. Declares the request.guard permission."
license = "MIT"
permissions = ["request.guard"]

[routes]
"/plugins/gate/verify" = "route_verify"
"/plugins/gate/check" = "route_check"
