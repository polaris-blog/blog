{{ template "partials/header.html" . }}

<div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-semibold tracking-tight">{{ if .is_new }}{{ t "admin.pages.new_page" }}{{ else }}{{ t "admin.pages.edit_page" }}{{ end }}</h2>
    <a href="/admin/pages" class="text-sm text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300 bg-zinc-100 dark:bg-zinc-800 px-4 py-2 rounded-lg transition-colors">{{ t "admin.pages.back" }}</a>
</div>

<div class="bg-white dark:bg-zinc-900 rounded-2xl p-6">
    <form id="page-form" onsubmit="return false;">
        <div class="mb-4">
            <label for="title" class="block text-sm font-medium mb-1.5">{{ t "admin.pages.title" }}</label>
            <input type="text" id="title" name="title" value="{{ if .post }}{{ .post.Title }}{{ end }}" required class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors">
        </div>
        <div class="mb-4">
            <label for="slug" class="block text-sm font-medium mb-1.5">{{ t "admin.pages.slug" }}</label>
            <input type="text" id="slug" name="slug" value="{{ if .post }}{{ .post.Slug }}{{ end }}" class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors">
        </div>
        <div class="mb-4">
            <label for="status" class="block text-sm font-medium mb-1.5">{{ t "admin.pages.status" }}</label>
            <div class="relative">
                <select id="status" name="status" class="post-select w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors cursor-pointer pr-10">
                    <option value="draft" {{ if and .post (eq .post.Status "draft") }}selected{{ end }}>{{ t "admin.pages.draft" }}</option>
                    <option value="published" {{ if and .post (eq .post.Status "published") }}selected{{ end }}>{{ t "admin.pages.published" }}</option>
                </select>
                <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
            </div>
        </div>
        <div class="mb-4">
            <label for="content" class="block text-sm font-medium mb-1.5">{{ t "admin.pages.content" }}</label>
            <textarea id="content" name="content">{{ if .post }}{{ .post.Content }}{{ end }}</textarea>
        </div>
        <button type="button" id="save-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2.5 rounded-full transition-colors active:scale-95">{{ t "admin.pages.save" }}</button>
    </form>
</div>

<style>
.post-select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
</style>

<script>
function savePage() {
    var btn = document.getElementById('save-btn');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = __('admin.pages.saving');
    var contentEl = document.getElementById('content');
    var content = (window._editor && window._editor.value) ? window._editor.value() : (contentEl ? contentEl.value : '');
    var data = {
        title: document.getElementById('title').value,
        slug: document.getElementById('slug').value,
        content: content,
        status: document.getElementById('status').value
    };
    var url, method;
    {{ if .is_new }}
    url = '/api/admin/pages'; method = 'POST';
    {{ else }}
    url = '/api/admin/pages/{{ .post.ID }}'; method = 'PUT';
    {{ end }}
    fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(function(r) {
        if (r.ok) {
            adminToast(__('admin.pages.saved'));
            setTimeout(function() { window.location.href = '/admin/pages'; }, 600);
        } else {
            return r.text().then(function(t) { adminToast(t || __('admin.pages.save_failed'), 'error'); });
        }
    }).catch(function(err) {
        adminToast(__('admin.pages.save_failed') + ': ' + err.message, 'error');
    }).finally(function() {
        btn.disabled = false;
        btn.textContent = __('admin.pages.save');
    });
}

document.getElementById('save-btn').addEventListener('click', savePage);

document.getElementById('title').addEventListener('input', function() {
    document.getElementById('slug').value = this.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
});

(function() {
    function initEditor() {
        var el = document.getElementById('content');
        if (!el || typeof EasyMDE === 'undefined') return null;
        try {
            return new EasyMDE({
                element: el,
                spellChecker: false,
                autosave: { enabled: false },
                toolbar: ['bold','italic','heading-2','heading-3','|','quote','code','link','image','|','unordered-list','ordered-list','|','preview','side-by-side','fullscreen','|','guide'],
                status: ['lines','words'],
                minHeight: '400px',
                previewRender: function(p) { return p; }
            });
        } catch(e) { return null; }
    }

    window._editor = initEditor();
    if (!window._editor && document.getElementById('content')) {
        var tries = 0;
        var timer = setInterval(function() {
            tries++;
            window._editor = initEditor();
            if (window._editor || tries > 20) clearInterval(timer);
        }, 100);
    }
})();
</script>

{{ template "partials/footer.html" . }}
