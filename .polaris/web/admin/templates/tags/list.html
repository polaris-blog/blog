{{ template "partials/header.html" . }}

<div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-semibold tracking-tight">{{ t "admin.tags.title" }}</h2>
    <button onclick="document.getElementById('tag-form').classList.toggle('hidden')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2.5 rounded-full transition-colors active:scale-95">{{ t "admin.tags.new" }}</button>
</div>

<div id="tag-form" class="hidden bg-white dark:bg-zinc-900 rounded-2xl p-6 mb-4">
    <form id="tag-create-form" class="flex items-end gap-3">
        <div class="flex-1"><label class="block text-sm font-medium mb-1.5">{{ t "admin.tags.name" }}</label><input type="text" id="tag-name" required class="w-full px-3.5 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"></div>
        <div class="flex-1"><label class="block text-sm font-medium mb-1.5">{{ t "admin.tags.slug" }}</label><input type="text" id="tag-slug" placeholder="{{ t "admin.tags.auto" }}" class="w-full px-3.5 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"></div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2.5 rounded-full transition-colors">{{ t "admin.tags.create" }}</button>
        <button type="button" onclick="document.getElementById('tag-form').classList.add('hidden')" class="text-sm text-zinc-500 bg-zinc-100 dark:bg-zinc-800 px-4 py-2.5 rounded-lg transition-colors">{{ t "admin.tags.cancel" }}</button>
    </form>
</div>

<div class="bg-white dark:bg-zinc-900 rounded-2xl p-6">
    {{ if .tags }}
    <div class="flex flex-wrap gap-2">
        {{ range .tags }}
        <span class="inline-flex items-center gap-1.5 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 text-sm px-3.5 py-1.5 rounded-full">
            {{ .Name }}
            <button hx-delete="/api/admin/tags/{{ .ID }}" hx-swap="none" hx-on::after-request="adminReload()" hx-confirm="{{ t "admin.tags.delete_confirm" }}" class="text-red-400 hover:text-red-600 text-base leading-none">&times;</button>
        </span>
        {{ end }}
    </div>
    {{ else }}
    <div class="text-center py-16 text-zinc-400">{{ t "admin.tags.no_tags" }}</div>
    {{ end }}
</div>

<script>
document.getElementById('tag-create-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('tag-name').value;
    const slug = document.getElementById('tag-slug').value || name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    fetch('/api/admin/tags', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,slug})}).then(r=>{if(r.ok)adminReload();else return r.text().then(t=>adminToast(t,'error'))});
});
</script>

{{ template "partials/footer.html" . }}
