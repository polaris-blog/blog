{% extends "base.html" %}

{% block title %}Tags - {{ site.Title }}{% endblock %}

{% block content %}
<div>
    <h1 class="text-3xl font-bold tracking-tight mb-10">{{ t("theme.tags.title") }}</h1>
    {% if tags %}
    <div class="flex flex-wrap gap-3">
        {% for tag in tags %}
        <a href="/tags/{{ tag.Slug }}" class="inline-flex items-center gap-1.5 px-4 py-2 bg-zinc-100 dark:bg-zinc-800 rounded-full text-sm font-medium text-zinc-700 dark:text-zinc-300 hover:bg-accent-soft hover:text-accent transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z"/><path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z"/></svg>
            {{ tag.Name }}
        </a>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-center text-zinc-400 py-16">{{ t("theme.tags.no_tags") }}</p>
    {% endif %}
</div>
{% endblock %}
