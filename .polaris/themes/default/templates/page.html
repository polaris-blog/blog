{% extends "base.html" %}

{% block title %}{{ page.Title }} - {{ site.Title }}{% endblock %}

{% block content %}
<div>
    <h1 class="text-3xl md:text-4xl font-bold tracking-tight leading-tight mb-8">{{ page.Title }}</h1>
    <article class="prose prose-zinc dark:prose-invert max-w-none">
        {{ page.Content|markdown }}
    </article>
</div>
{% endblock %}
