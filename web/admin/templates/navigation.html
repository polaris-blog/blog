{{ template "partials/header.html" . }}

<div class="mb-6">
    <h2 class="text-xl font-semibold tracking-tight">{{ t "admin.navigation.title" }}</h2>
    <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">{{ t "admin.navigation.description" }}</p>
</div>

<div class="bg-white dark:bg-zinc-900 rounded-2xl p-6">
    <form id="nav-form">
        <div class="mb-4">
            <h3 class="text-sm font-semibold mb-3">{{ t "admin.navigation.menu_items" }}</h3>
            <div id="nav-items" class="space-y-2"></div>
            <button type="button" id="add-item" class="mt-3 text-sm text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 font-medium transition-colors">{{ t "admin.navigation.add_item" }}</button>
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2.5 rounded-full transition-colors active:scale-95">{{ t "admin.navigation.save" }}</button>
    </form>
</div>

<script>
var navItems = [];

function renderNavItems() {
    var container = document.getElementById('nav-items');
    if (navItems.length === 0) {
        container.innerHTML = '<p class="text-sm text-zinc-400 py-4">' + __('admin.navigation.no_items') + '</p>';
        return;
    }
    container.innerHTML = navItems.map(function(item, i) {
        return '<div class="bg-zinc-50 dark:bg-zinc-800/50 rounded-xl p-3 space-y-2">'
            + '<div class="flex items-center gap-2">'
            + '<input type="text" value="' + (item.label || '') + '" data-index="' + i + '" data-field="label" placeholder="' + __('admin.navigation.label_placeholder') + '" class="flex-1 min-w-0 px-3 py-2 text-sm bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">'
            + '<input type="text" value="' + (item.url || '') + '" data-index="' + i + '" data-field="url" placeholder="' + __('admin.navigation.url_placeholder') + '" class="flex-1 min-w-0 px-3 py-2 text-sm bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">'
            + '</div>'
            + '<div class="flex items-center justify-end gap-1">'
            + '<button type="button" data-index="' + i + '" data-action="up" title="' + __('admin.navigation.move_up') + '" class="p-2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-700"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg></button>'
            + '<button type="button" data-index="' + i + '" data-action="down" title="' + __('admin.navigation.move_down') + '" class="p-2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-700"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg></button>'
            + '<button type="button" data-index="' + i + '" data-action="remove" title="' + __('admin.navigation.remove') + '" class="p-2 text-red-400 hover:text-red-600 transition-colors rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>'
            + '</div></div>';
    }).join('');

    container.querySelectorAll('input').forEach(function(input) {
        input.addEventListener('change', function() {
            var idx = parseInt(this.dataset.index);
            navItems[idx][this.dataset.field] = this.value;
        });
    });

    container.querySelectorAll('button').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var idx = parseInt(this.dataset.index);
            var action = this.dataset.action;
            if (action === 'up' && idx > 0) {
                var tmp = navItems[idx]; navItems[idx] = navItems[idx-1]; navItems[idx-1] = tmp;
                renderNavItems();
            } else if (action === 'down' && idx < navItems.length - 1) {
                var tmp = navItems[idx]; navItems[idx] = navItems[idx+1]; navItems[idx+1] = tmp;
                renderNavItems();
            } else if (action === 'remove') {
                navItems.splice(idx, 1);
                renderNavItems();
            }
        });
    });
}

document.getElementById('add-item').addEventListener('click', function() {
    navItems.push({label: '', url: ''});
    renderNavItems();
});

document.getElementById('nav-form').addEventListener('submit', function(e) {
    e.preventDefault();
    fetch('/api/admin/nav', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({items: navItems})
    }).then(function(r) {
        if (r.ok) {
            adminToast(__('admin.navigation.saved'));
        } else {
            return r.text().then(function(t) { adminToast(t || __('admin.navigation.save_failed'), 'error'); });
        }
    });
});

fetch('/api/admin/nav').then(function(r) { return r.json(); }).then(function(data) {
    if (data.items && data.items.length > 0) {
        navItems = data.items;
    }
    renderNavItems();
});
</script>

{{ template "partials/footer.html" . }}
