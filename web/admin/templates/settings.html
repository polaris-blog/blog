{{ template "partials/header.html" . }}

<div class="mb-6">
    <h2 class="text-xl font-semibold tracking-tight">{{ t "admin.settings.title" }}</h2>
</div>

<div class="bg-white dark:bg-zinc-900 rounded-2xl p-6">
    <form id="settings-form">
        <div class="mb-5">
            <label class="block text-sm font-medium mb-1.5">{{ t "admin.settings.site_icon" }}</label>
            <div class="flex items-center gap-4">
                <div id="site-icon-preview" class="w-12 h-12 rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 flex items-center justify-center overflow-hidden">
                    {{ if .settings.site_icon }}<img src="{{ .settings.site_icon }}" class="w-full h-full object-cover">{{ else }}<svg class="w-5 h-5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0022.5 18.75V5.25A2.25 2.25 0 0020.25 3H3.75A2.25 2.25 0 001.5 5.25v13.5A2.25 2.25 0 003.75 21z"/></svg>{{ end }}
                </div>
                <div>
                    <label for="site-icon-upload" class="cursor-pointer bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-sm font-medium px-4 py-2 rounded-lg transition-colors inline-flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        {{ t "admin.settings.upload" }}
                    </label>
                    <input type="file" id="site-icon-upload" accept="image/*" class="hidden">
                    <p class="text-xs text-zinc-400 mt-1">{{ t "admin.settings.icon_hint" }}</p>
                </div>
            </div>
            <input type="hidden" id="site_icon" value="{{ .settings.site_icon }}">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1.5">{{ t "admin.settings.site_title" }}</label>
            <input type="text" id="site_title" value="{{ .settings.site_title }}" class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1.5">{{ t "admin.settings.site_description" }}</label>
            <input type="text" id="site_description" value="{{ .settings.site_description }}" class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1.5">{{ t "admin.settings.site_url" }}</label>
            <input type="text" id="site_url" value="{{ .settings.site_url }}" class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
        </div>
        <div class="mb-5">
            <label class="block text-sm font-medium mb-1.5">{{ t "admin.settings.language" }}</label>
            <select id="site_language" class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500">
                <option value="en" {{ if or (eq .settings.site_language "en") (eq .settings.site_language "") }}selected{{ end }}>{{ t "admin.settings.lang_en" }}</option>
                <option value="zh" {{ if eq .settings.site_language "zh" }}selected{{ end }}>{{ t "admin.settings.lang_zh" }}</option>
            </select>
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2.5 rounded-full transition-colors active:scale-95">{{ t "admin.settings.save" }}</button>
    </form>
</div>

<script>
document.getElementById('site-icon-upload').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var formData = new FormData();
    formData.append('file', file);
    fetch('/api/admin/media/upload', {
        method: 'POST',
        body: formData
    }).then(function(r) {
        if (!r.ok) throw new Error(__('admin.media.upload_failed').replace('%name%', ''));
        return r.json();
    }).then(function(data) {
        var url = data.url || '/uploads/' + data.filename;
        document.getElementById('site_icon').value = url;
        document.getElementById('site-icon-preview').innerHTML = '<img src="' + url + '" class="w-full h-full object-cover">';
    }).catch(function() {
        adminToast(__('admin.media.icon_upload_failed'), 'error');
    });
});

document.getElementById('settings-form').addEventListener('submit', function(e) {
    e.preventDefault();
    fetch('/api/admin/settings', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            site_title: document.getElementById('site_title').value,
            site_description: document.getElementById('site_description').value,
            site_url: document.getElementById('site_url').value,
            site_icon: document.getElementById('site_icon').value,
            site_language: document.getElementById('site_language').value
        })
    }).then(function(r) {
        if (r.ok) {
            adminToast(__('admin.settings.saved'));
            document.title = document.getElementById('site_title').value + ' ' + __('admin.settings.admin_suffix');
            var brand = document.querySelector('aside h1 a');
            if (brand) {
                var iconEl = brand.querySelector('img');
                brand.textContent = document.getElementById('site_title').value;
                if (iconEl && document.getElementById('site_icon').value) {
                    brand.insertBefore(iconEl, brand.firstChild);
                }
            }
        }
    });
});
</script>

{{ template "partials/footer.html" . }}
