{{ template "partials/header.html" . }}

<div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-semibold tracking-tight">{{ if .is_new }}{{ t "admin.posts.new_post" }}{{ else }}{{ t "admin.posts.edit_post" }}{{ end }}</h2>
    <a href="/admin/posts" class="text-sm text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300 bg-zinc-100 dark:bg-zinc-800 px-4 py-2 rounded-lg transition-colors">{{ t "admin.posts.back" }}</a>
</div>

<div class="bg-white dark:bg-zinc-900 rounded-2xl p-6">
    <form id="post-form" onsubmit="return false;">
        <div class="mb-4">
            <label for="title" class="block text-sm font-medium mb-1.5">{{ t "admin.posts.title" }}</label>
            <input type="text" id="title" name="title" value="{{ if .post }}{{ .post.Title }}{{ end }}" required class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors">
        </div>
        <div class="mb-4">
            <label for="slug" class="block text-sm font-medium mb-1.5">{{ t "admin.posts.slug" }}</label>
            <input type="text" id="slug" name="slug" value="{{ if .post }}{{ .post.Slug }}{{ end }}" class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
                <label for="category" class="block text-sm font-medium mb-1.5">{{ t "admin.posts.category" }}</label>
                <div class="relative">
                    <select id="category" class="post-select w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors cursor-pointer pr-10">
                        <option value="">{{ t "admin.posts.none" }}</option>
                        {{ range .categories }}
                        <option value="{{ .ID }}" {{ if and $.post (eq $.post.CategoryID .ID) }}selected{{ end }}>{{ .Name }}</option>
                        {{ end }}
                    </select>
                    <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </div>
            </div>
            <div>
                <label for="status" class="block text-sm font-medium mb-1.5">{{ t "admin.posts.status" }}</label>
                <div class="relative">
                    <select id="status" name="status" class="post-select w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors cursor-pointer pr-10">
                        <option value="draft" {{ if and .post (eq .post.Status "draft") }}selected{{ end }}>{{ t "admin.posts.draft" }}</option>
                        <option value="published" {{ if and .post (eq .post.Status "published") }}selected{{ end }}>{{ t "admin.posts.published" }}</option>
                    </select>
                    <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </div>
            </div>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1.5">{{ t "admin.posts.tags" }}</label>
            <div id="tag-selector" class="relative">
                <div id="tag-chips" class="flex flex-wrap gap-2 mb-2"></div>
                <input type="text" id="tag-search" placeholder="{{ t "admin.posts.tags_placeholder" }}" class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors" autocomplete="off">
                <div id="tag-dropdown" class="absolute top-full left-0 right-0 mt-1 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-xl shadow-xl max-h-48 overflow-y-auto z-10 hidden"></div>
            </div>
        </div>
        <div class="mb-4">
            <label for="content" class="block text-sm font-medium mb-1.5">{{ t "admin.posts.content" }}</label>
            <textarea id="content" name="content">{{ if .post }}{{ .post.Content }}{{ end }}</textarea>
        </div>
        <div class="mb-5">
            <label for="excerpt" class="block text-sm font-medium mb-1.5">{{ t "admin.posts.excerpt" }}</label>
            <textarea id="excerpt" name="excerpt" class="w-full px-4 py-2.5 text-sm bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors min-h-[80px] resize-y">{{ if .post }}{{ .post.Excerpt }}{{ end }}</textarea>
        </div>
        <button type="button" id="save-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2.5 rounded-full transition-colors active:scale-95">{{ t "admin.posts.save" }}</button>
    </form>
</div>

<style>
.post-select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
</style>

<script>
window._selectedTagIds = [];

function savePost() {
    var btn = document.getElementById('save-btn');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = __('admin.posts.saving');
    var contentEl = document.getElementById('content');
    var content = (window._editor && window._editor.value) ? window._editor.value() : (contentEl ? contentEl.value : '');
    var catVal = document.getElementById('category').value;
    var data = {
        title: document.getElementById('title').value,
        slug: document.getElementById('slug').value,
        content: content,
        excerpt: document.getElementById('excerpt').value,
        status: document.getElementById('status').value,
        category_id: catVal || undefined,
        tag_ids: window._selectedTagIds || []
    };
    var url, method;
    {{ if .is_new }}
    url = '/api/admin/posts'; method = 'POST';
    {{ else }}
    url = '/api/admin/posts/{{ .post.ID }}'; method = 'PUT';
    {{ end }}
    fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(function(r) {
        if (r.ok) {
            adminToast(__('admin.posts.saved'));
            setTimeout(function() { window.location.href = '/admin/posts'; }, 600);
        } else {
            return r.text().then(function(t) { adminToast(t || __('admin.posts.save_failed'), 'error'); });
        }
    }).catch(function(err) {
        adminToast(__('admin.posts.save_failed') + ': ' + err.message, 'error');
    }).finally(function() {
        btn.disabled = false;
        btn.textContent = __('admin.posts.save');
    });
}

document.getElementById('save-btn').addEventListener('click', savePost);

document.getElementById('title').addEventListener('input', function() {
    document.getElementById('slug').value = this.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
});

(function() {
    try {
        var allTags = {{ .tags | json }} || [];
        var selectedTags = {{ if .post }}({{ .post.Tags | json }} || []){{ else }}[]{{ end }};
        window._selectedTagIds = (selectedTags || []).map(function(t) { return t.id; });

        function renderChips() {
            var container = document.getElementById('tag-chips');
            if (!container) return;
            container.innerHTML = '';
            window._selectedTagIds.forEach(function(tid) {
                var tag = (allTags || []).find(function(t) { return t.id === tid; });
                if (!tag) return;
                var chip = document.createElement('span');
                chip.className = 'inline-flex items-center gap-1.5 px-3 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 text-xs font-medium rounded-full';
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'hover:text-blue-900 dark:hover:text-blue-100 ml-0.5';
                btn.innerHTML = '&times;';
                btn.addEventListener('click', function() {
                    window._selectedTagIds = window._selectedTagIds.filter(function(id) { return id !== tid; });
                    renderChips();
                });
                chip.textContent = tag.name + ' ';
                chip.appendChild(btn);
                container.appendChild(chip);
            });
        }

        function renderDropdown(filter) {
            var dropdown = document.getElementById('tag-dropdown');
            if (!dropdown) return;
            var query = (filter || '').toLowerCase();
            var available = (allTags || []).filter(function(t) {
                return window._selectedTagIds.indexOf(t.id) === -1 && (!query || (t.name || '').toLowerCase().indexOf(query) !== -1);
            });
            dropdown.innerHTML = '';
            if (available.length === 0 && !query) {
                dropdown.classList.add('hidden');
                return;
            }
            available.forEach(function(tag) {
                var item = document.createElement('button');
                item.type = 'button';
                item.className = 'w-full text-left px-4 py-2.5 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors flex items-center justify-between';
                var nameSpan = document.createElement('span');
                nameSpan.textContent = tag.name;
                var slugSpan = document.createElement('span');
                slugSpan.className = 'text-xs text-zinc-400 font-mono';
                slugSpan.textContent = tag.slug;
                item.appendChild(nameSpan);
                item.appendChild(slugSpan);
                item.addEventListener('click', function() {
                    window._selectedTagIds.push(tag.id);
                    document.getElementById('tag-search').value = '';
                    renderChips();
                    dropdown.classList.add('hidden');
                });
                dropdown.appendChild(item);
            });
            if (query && available.length === 0) {
                var create = document.createElement('button');
                create.type = 'button';
                create.className = 'w-full text-left px-4 py-2.5 text-sm text-blue-600 dark:text-blue-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors';
                create.textContent = __('admin.posts.create_tag').replace('%filter%', filter);
                create.addEventListener('click', function() {
                    fetch('/api/admin/tags', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: filter, slug: filter.toLowerCase().replace(/[^a-z0-9]+/g, '-') })
                    }).then(function(r) { return r.json(); }).then(function(newTag) {
                        allTags.push(newTag);
                        window._selectedTagIds.push(newTag.id);
                        document.getElementById('tag-search').value = '';
                        renderChips();
                        dropdown.classList.add('hidden');
                    });
                });
                dropdown.innerHTML = '';
                dropdown.appendChild(create);
            }
            dropdown.classList.remove('hidden');
        }

        var searchInput = document.getElementById('tag-search');
        if (searchInput) {
            searchInput.addEventListener('focus', function() { renderDropdown(this.value); });
            searchInput.addEventListener('input', function() { renderDropdown(this.value); });
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); return false; }
            });
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#tag-selector')) {
                var dd = document.getElementById('tag-dropdown');
                if (dd) dd.classList.add('hidden');
            }
        });

        renderChips();
    } catch(e) {
        console.error('Tags init error:', e);
    }
})();

(function() {
    function initEditor() {
        var el = document.getElementById('content');
        if (!el || typeof EasyMDE === 'undefined') return null;
        try {
            return new EasyMDE({
                element: el,
                spellChecker: false,
                autosave: { enabled: false },
                toolbar: ['bold','italic','heading-2','heading-3','|','quote','code','link','image','|','unordered-list','ordered-list','|','preview','side-by-side','fullscreen','|','guide'],
                status: ['lines','words'],
                minHeight: '400px',
                previewRender: function(p) { return p; }
            });
        } catch(e) { return null; }
    }

    window._editor = initEditor();
    if (!window._editor && document.getElementById('content')) {
        var tries = 0;
        var timer = setInterval(function() {
            tries++;
            window._editor = initEditor();
            if (window._editor || tries > 20) clearInterval(timer);
        }, 100);
    }
})();
</script>
