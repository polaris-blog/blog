        </div>
    </main>
<script>
(function() {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:0;left:0;height:3px;z-index:999999;pointer-events:none;width:0;transition:none;background:#3b82f6;box-shadow:0 0 10px #3b82f6';
    document.documentElement.appendChild(bar);

    var PAGE_ID = 'admin-page';
    var navVersion = 0;
    var progressTimer = null;

    function isInternalLink(url) {
        try { var u = new URL(url, location.origin); return u.origin === location.origin && u.pathname.startsWith('/admin'); }
        catch(e) { return false; }
    }

    function isNavigable(a) {
        if (!a.href || a.target === '_blank' || a.hasAttribute('download')) return false;
        if (a.href.indexOf('javascript:') === 0) return false;
        if (a.closest('form')) return false;
        if (a.getAttribute('hx-delete') || a.getAttribute('hx-post')) return false;
        if (a.pathname === '/admin/auth/logout') return false;
        return isInternalLink(a.href);
    }

    function executeScripts(container) {
        var scripts = container.querySelectorAll('script');
        scripts.forEach(function(oldScript) {
            var newScript = document.createElement('script');
            if (oldScript.src) {
                newScript.src = oldScript.src;
                newScript.async = false;
            } else {
                newScript.textContent = oldScript.textContent;
            }
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    function startProgress() {
        if (progressTimer) clearTimeout(progressTimer);
        bar.style.transition = 'none';
        bar.style.width = '0';
        void bar.offsetWidth;
        bar.style.transition = 'width 300ms ease';
        bar.style.width = '60%';
        progressTimer = setTimeout(function() {
            bar.style.width = '85%';
        }, 600);
    }

    function finishProgress() {
        if (progressTimer) clearTimeout(progressTimer);
        bar.style.transition = 'width 150ms ease';
        bar.style.width = '100%';
        setTimeout(function() {
            bar.style.transition = 'none';
            bar.style.width = '0';
        }, 200);
    }

    function swapContent(html, url) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var newPage = doc.getElementById(PAGE_ID);
        if (!newPage) { location.href = url; return; }

        var page = document.getElementById(PAGE_ID);
        page.innerHTML = newPage.innerHTML;

        var newTitle = doc.querySelector('title');
        if (newTitle) document.title = newTitle.textContent;

        executeScripts(page);
        if (typeof htmx !== 'undefined') htmx.process(page);

        finishProgress();
    }

    function navigate(url, push) {
        var ver = ++navVersion;
        if (push) history.pushState({ url: url }, '', url);
        startProgress();
        window.scrollTo({ top: 0, behavior: 'instant' });

        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.setRequestHeader('X-Requested-With', 'polarnav');
        xhr.onload = function() {
            if (ver !== navVersion) return;
            if (xhr.status === 401 || xhr.status === 403) { location.href = '/admin/login'; return; }
            if (xhr.status >= 200 && xhr.status < 400) {
                swapContent(xhr.responseText, url);
            } else {
                location.href = url;
            }
        };
        xhr.onerror = function() {
            if (ver !== navVersion) return;
            location.href = url;
        };
        xhr.send();
    }

    window.adminNavigate = function(url) {
        navigate(url || location.href, false);
    };

    window.adminReload = function() {
        navigate(location.href, false);
    };

    document.addEventListener('click', function(e) {
        var a = e.target.closest('a[href]');
        if (!a || !isNavigable(a)) return;
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        navigate(a.href, true);
    });

    window.addEventListener('popstate', function(e) {
        if (e.state && e.state.url) navigate(e.state.url, false);
        else navigate(location.href, false);
    });

    history.replaceState({ url: location.href }, '');
})();
</script>
</body>
</html>
