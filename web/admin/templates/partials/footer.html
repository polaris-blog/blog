        </div>
    </main>
<script>
(function() {
    var PAGE_ID = 'admin-page';

    function isInternalLink(url) {
        try { var u = new URL(url, location.origin); return u.origin === location.origin && u.pathname.startsWith('/admin'); }
        catch { return false; }
    }

    function isNavigable(a) {
        if (a.target === '_blank') return false;
        if (a.hasAttribute('download')) return false;
        if (a.href.startsWith('javascript:')) return false;
        if (a.closest('form')) return false;
        if (a.getAttribute('hx-delete') || a.getAttribute('hx-post')) return false;
        if (a.pathname === '/admin/auth/logout') return false;
        return isInternalLink(a.href);
    }

    function executeScripts(container) {
        var scripts = container.querySelectorAll('script');
        scripts.forEach(function(oldScript) {
            var newScript = document.createElement('script');
            if (oldScript.src) {
                newScript.src = oldScript.src;
                newScript.async = false;
            } else {
                newScript.textContent = oldScript.textContent;
            }
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    function swapContent(html, url) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var newPage = doc.getElementById(PAGE_ID);
        var newTitle = doc.querySelector('title');
        if (!newPage) { location.href = url; return; }

        var page = document.getElementById(PAGE_ID);
        page.style.opacity = '0';
        page.style.transform = 'translateY(6px)';

        setTimeout(function() {
            page.innerHTML = newPage.innerHTML;
            if (newTitle) document.title = newTitle.textContent;
            window.scrollTo({ top: 0, behavior: 'instant' });

            executeScripts(page);

            page.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
            page.style.opacity = '1';
            page.style.transform = 'translateY(0)';

            setTimeout(function() { page.style.transition = ''; page.style.transform = ''; }, 200);

            if (typeof htmx !== 'undefined') htmx.process(page);
        }, 120);
    }

    function navigate(url, push) {
        fetch(url, { headers: { 'X-Requested-With': 'polarnav' } }).then(function(res) {
            if (res.status === 401 || res.status === 403) { location.href = '/admin/login'; return; }
            if (res.redirected) { location.href = res.url; return; }
            if (!res.ok) { location.href = url; return; }
            return res.text();
        }).then(function(html) {
            if (!html) return;
            swapContent(html, url);
            if (push) history.pushState({ url: url }, '', url);
        }).catch(function() { location.href = url; });
    }

    window.adminNavigate = function(url) {
        navigate(url || location.href, false);
    };

    window.adminReload = function() {
        navigate(location.href, false);
    };

    document.addEventListener('click', function(e) {
        var a = e.target.closest('a[href]');
        if (!a || !isNavigable(a)) return;
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        navigate(a.href, true);
    });

    window.addEventListener('popstate', function(e) {
        if (e.state && e.state.url) navigate(e.state.url, false);
        else navigate(location.href, false);
    });

    history.replaceState({ url: location.href }, '');
})();
</script>
</body>
</html>
