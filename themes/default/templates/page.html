{% extends "base.html" %}
{% block content %}
<section class="page-section">
  <div class="container">
    <article class="post-full">
      <header class="post-header">
        <h1>{{ page.title }}</h1>
        <div class="post-meta"><time datetime="{{ page.date }}">{{ t(key="post.updated", date=page.date) }}</time></div>
      </header>
      <div class="post-body" data-highlight>{{ page.content_html | safe }}</div>
    </article>
  </div>
</section>
{% endblock content %}
