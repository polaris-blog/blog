<!DOCTYPE html>
<html lang="{{ lang }}" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site.Title }}{% endblock %}</title>
    {% if site.Icon %}<link rel="icon" href="{{ site.Icon }}">{% endif %}
    <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="/feed.xml">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                },
                colors: {
                    accent: 'var(--accent-color, #3b82f6)',
                },
            }
        }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
    :root {
        --accent-color: {% if theme_settings and theme_settings.accent_color %}{{ theme_settings.accent_color }}{% else %}#3b82f6{% endif %};
    }
    .prose { line-height: 1.75; font-size: 1.0625rem; }
    .prose p { margin-top: 1.5em; margin-bottom: 1.5em; }
    .prose h1 { font-size: 2.25em; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.5em; line-height: 1.2; letter-spacing: -0.025em; }
    .prose h2 { font-size: 1.75em; font-weight: 600; margin-top: 2em; margin-bottom: 0.75em; line-height: 1.3; letter-spacing: -0.02em; border-bottom: 1px solid color-mix(in srgb, var(--accent-color) 20%, transparent); padding-bottom: 0.3em; }
    .prose h3 { font-size: 1.375em; font-weight: 600; margin-top: 1.75em; margin-bottom: 0.5em; line-height: 1.4; }
    .prose h4 { font-size: 1.125em; font-weight: 600; margin-top: 1.5em; margin-bottom: 0.5em; }
    .prose ul, .prose ol { margin-top: 1.25em; margin-bottom: 1.25em; padding-left: 1.625em; }
    .prose li { margin-top: 0.5em; margin-bottom: 0.5em; }
    .prose ul { list-style-type: disc; }
    .prose ol { list-style-type: decimal; }
    .prose li::marker { color: var(--accent-color); }
    .prose blockquote { border-left: 4px solid var(--accent-color); padding: 0.5em 1.25em; margin: 1.5em 0; background: color-mix(in srgb, var(--accent-color) 5%, transparent); border-radius: 0 0.5rem 0.5rem 0; font-style: italic; color: #52525b; }
    .dark .prose blockquote { color: #a1a1aa; }
    .prose a { color: var(--accent-color); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
    .prose a:hover { border-bottom-color: var(--accent-color); }
    .prose img, .prose video { max-width: 100%; height: auto; border-radius: 0.75rem; margin: 2em 0; }
    .prose hr { border: none; border-top: 1px solid #e4e4e7; margin: 3em 0; }
    .dark .prose hr { border-top-color: #27272a; }
    .prose table { width: 100%; margin: 2em 0; border-collapse: collapse; font-size: 0.9375em; }
    .prose th { text-align: left; font-weight: 600; padding: 0.75em 1em; border-bottom: 2px solid #e4e4e7; background: #fafafa; }
    .dark .prose th { border-bottom-color: #3f3f46; background: #18181b; }
    .prose td { padding: 0.75em 1em; border-bottom: 1px solid #f4f4f5; }
    .dark .prose td { border-bottom-color: #27272a; }
    .prose tr:hover { background: #fafafa; }
    .dark .prose tr:hover { background: #18181b; }
    .prose pre { background: #1a1a2e; color: #eee; padding: 1.25em 1.5em; border-radius: 0.75rem; overflow-x: auto; margin: 1.5em 0; font-size: 0.875em; line-height: 1.7; }
    .prose code { font-family: 'JetBrains Mono', monospace; background: color-mix(in srgb, var(--accent-color) 12%, transparent); color: var(--accent-color); padding: 0.2em 0.4em; border-radius: 0.25rem; font-size: 0.875em; }
    .prose pre code { background: transparent; color: inherit; padding: 0; font-size: inherit; }
    .prose .chroma { background: transparent; padding: 0; margin: 0; }
    .prose .chroma .ln { color: #666; margin-right: 1.5em; user-select: none; }
    .prose .chroma .lnt { margin-right: 1.5em; color: #666; }
    .prose .katex-display { margin: 1.5em 0; overflow-x: auto; padding: 0.5em 0; }
    .prose .katex { font-size: 1.1em; }
    .prose .mermaid { background: transparent; text-align: center; margin: 2em 0; }
    .prose pre.language-mermaid, .prose pre.language-flow, .prose pre.language-seq,
    .prose pre.language-math, .prose pre.language-katex, .prose pre.language-latex { background: transparent; padding: 0; }
    .prose pre.language-mermaid code, .prose pre.language-flow code, .prose pre.language-seq code,
    .prose pre.language-math code, .prose pre.language-katex code, .prose pre.language-latex code { background: transparent; color: inherit; }
    .prose pre:has(code.language-math), .prose pre:has(code.language-katex), .prose pre:has(code.language-latex) { display: none; }
    .render-error { color: #ef4444; font-family: monospace; font-size: 0.875rem; white-space: pre-wrap; }
    .btn-accent { background-color: var(--accent-color); color: white; font-size: 0.875rem; font-weight: 500; padding: 0.625rem 1.5rem; border-radius: 9999px; transition: all 0.15s; }
    .btn-accent:hover { filter: brightness(1.1); }
    .btn-accent:active { transform: scale(0.95); }
    .text-accent { color: var(--accent-color); }
    .bg-accent-soft { background: color-mix(in srgb, var(--accent-color) 10%, transparent); }
    .border-accent { border-color: var(--accent-color); }
    .github-card { display:flex; align-items:flex-start; gap:0.75rem; border:1px solid #d0d7de; border-radius:0.375rem; padding:1rem; margin:1.5rem 0; background:#fff; max-width:100%; text-decoration:none; color:inherit; transition: border-color 0.15s, background-color 0.15s; }
    .github-card:hover { border-color:#0969da; }
    .gc-book-icon { flex-shrink:0; margin-top:2px; fill:#6e7781; }
    .gc-body { flex:1; min-width:0; }
    .gc-header { display:flex; align-items:center; gap:0.5rem; }
    .gc-repo-icon { fill:#6e7781; }
    .gc-name { font-weight:600; color:#0969da; font-size:0.875rem; }
    .gc-desc { color:#656d76; font-size:0.8125rem; margin:0.375rem 0 0 0; line-height:1.4; }
    .gc-stats { display:flex; align-items:center; gap:1rem; margin-top:0.625rem; font-size:0.75rem; color:#656d76; }
    .gc-meta { display:flex; align-items:center; gap:0.25rem; }
    .gc-lang-dot { display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid rgba(0,0,0,0.1); }
    .gc-star { fill:#e3b341; }
    .gc-fork { fill:#656d76; }
    .dark .github-card { background:#161b22; border-color:#30363d; }
    .dark .github-card:hover { border-color:#58a6ff; }
    .dark .github-card, .dark .github-card * { color:#c9d1d9; }
    .dark .gc-name { color:#58a6ff !important; }
    .dark .gc-desc, .dark .gc-stats, .dark .gc-meta { color:#8b949e !important; }
    .dark .gc-book-icon, .dark .gc-repo-icon { fill:#8b949e !important; }
    .dark .gc-fork { fill:#8b949e !important; }
    .dark .gc-lang-dot { border-color:rgba(255,255,255,0.1); }
    @media(max-width:1023px){.sidebar-mobile{display:block;margin-top:2rem}}
    </style>
    <script>
    (function() {
        var previewKey = null;
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.startsWith('theme_preview_')) { previewKey = k; break; }
        }
        if (previewKey) {
            try {
                var settings = JSON.parse(localStorage.getItem(previewKey));
                if (settings) {
                    if (settings.accent_color) {
                        document.documentElement.style.setProperty('--accent-color', settings.accent_color);
                    }
                }
                localStorage.removeItem(previewKey);
            } catch(e) {}
        }
    })();
    </script>
    {% block head %}{% endblock %}
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans antialiased transition-colors duration-200 min-h-screen flex flex-col">
    {% include "partials/header.html" %}
    <div class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-5 pt-4 sm:pt-16 pb-8 sm:pb-16 flex flex-col lg:flex-row gap-6 lg:gap-8">
        <main id="main-content" class="flex-1 min-w-0">
            {% block content %}{% endblock %}
        </main>
        <div class="sidebar-mobile lg:hidden">
            {% include "partials/sidebar.html" %}
        </div>
        <div class="hidden lg:block w-64 shrink-0">
            {% include "partials/sidebar.html" %}
        </div>
    </div>
    {% include "partials/footer.html" %}
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad: false, theme: 'default' });

function renderContent(container) {
    if (!container) return;

    if (typeof renderMathInElement === 'function') {
        renderMathInElement(container, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\[', right: '\\]', display: true},
                {left: '\\(', right: '\\)', display: false}
            ],
            throwOnError: false
        });
    }

    var diagramSel = 'pre.language-mermaid, pre.language-flow, pre.language-seq, pre code.language-mermaid, pre code.language-flow, pre code.language-seq';
    container.querySelectorAll(diagramSel).forEach(function(pre) {
        var code = pre.tagName === 'CODE' ? pre : pre.querySelector('code');
        if (!code) code = pre;
        var content = code.textContent;

        var div = document.createElement('div');
        div.className = 'mermaid';
        div.style.display = 'none';
        div.textContent = content;
        pre.parentNode.replaceChild(div, pre);
        mermaid.run({ nodes: [div] }).then(function() {
            div.style.display = '';
        }).catch(function() {
            div.style.display = '';
            div.className = 'render-error';
            div.textContent = content;
        });
    });

    var mathSel = 'pre.language-katex, pre.language-latex, pre.language-math, pre code.language-katex, pre code.language-latex, pre code.language-math';
    container.querySelectorAll(mathSel).forEach(function(pre) {
        var code = pre.tagName === 'CODE' ? pre : pre.querySelector('code');
        if (!code) code = pre;
        var content = code.textContent.trim();
        var div = document.createElement('div');
        div.className = 'katex-display';
        pre.style.display = 'none';
        try {
            window.katex.render(content, div, { displayMode: true, throwOnError: false });
            pre.parentNode.insertBefore(div, pre);
            pre.remove();
        } catch(e) {
            pre.style.display = '';
            pre.className = 'render-error';
        }
    });
}

window.renderContent = renderContent;

window.initTOC = function() {
    var tocCard = document.getElementById('toc-card');
    var tocList = document.getElementById('toc-list');
    if (!tocCard || !tocList) return;

    var prose = document.querySelector('#main-content .prose');
    if (!prose) { hideTOC(); return; }

    var headings = prose.querySelectorAll('h2, h3, h4');
    if (headings.length === 0) { hideTOC(); return; }

    tocList.innerHTML = '';
    headings.forEach(function(h, i) {
        var id = h.id || ('heading-' + i);
        h.id = id;
        var level = parseInt(h.tagName.charAt(1));
        var a = document.createElement('a');
        a.href = '#' + id;
        a.className = 'block text-zinc-500 dark:text-zinc-400 hover:text-accent transition-colors truncate';
        a.style.paddingLeft = ((level - 2) * 12) + 'px';
        a.textContent = h.textContent;
        tocList.appendChild(a);
    });

    tocCard.classList.remove('hidden');
    requestAnimationFrame(function() {
        tocCard.classList.remove('opacity-0');
        tocCard.classList.add('opacity-100');
    });

    tocList.onclick = function(e) {
        var a = e.target.closest('a[href^="#"]');
        if (!a) return;
        e.preventDefault();
        var target = document.getElementById(a.getAttribute('href').slice(1));
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
};

window.hideTOC = function() {
    var tocCard = document.getElementById('toc-card');
    var tocList = document.getElementById('toc-list');
    if (!tocCard || !tocList) return;
    if (tocCard.classList.contains('hidden')) return;

    tocCard.classList.remove('opacity-100');
    tocCard.classList.add('opacity-0');
    setTimeout(function() {
        tocCard.classList.add('hidden');
        tocList.innerHTML = '';
    }, 300);
};

window.initTypewriter = function() {
    var el = document.getElementById('typewriter');
    if (!el || !el.dataset.text) return;
    var text = el.dataset.text;
    var i = 0;
    el.textContent = '';
    function type() {
        if (i < text.length) {
            el.textContent += text.charAt(i);
            i++;
            setTimeout(type, 50);
        }
    }
    setTimeout(type, 500);
};

function onPageLoad() {
    renderContent(document.querySelector('.prose'));
    initTOC();
    initTypewriter();
}

document.addEventListener('DOMContentLoaded', onPageLoad);

</script>
<script>
(function() {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:0;left:0;height:3px;z-index:999999;pointer-events:none;width:0;transition:none';
    bar.style.background = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim() || '#3b82f6';
    bar.style.boxShadow = '0 0 10px ' + bar.style.background;
    document.documentElement.appendChild(bar);

    var navVersion = 0;
    var progressTimer = null;
    var MAIN_ID = 'main-content';

    function isInternalLink(url) {
        try { return new URL(url, location.origin).origin === location.origin; }
        catch(e) { return false; }
    }

    function isNavigable(a) {
        if (!a.href || a.target === '_blank' || a.hasAttribute('download')) return false;
        if (a.href.indexOf('javascript:') === 0) return false;
        if (a.closest('#comment-form')) return false;
        return isInternalLink(a.href);
    }

    function startProgress() {
        if (progressTimer) clearTimeout(progressTimer);
        bar.style.transition = 'none';
        bar.style.width = '0';
        void bar.offsetWidth;
        bar.style.transition = 'width 300ms ease';
        bar.style.width = '60%';
        progressTimer = setTimeout(function() {
            bar.style.width = '85%';
        }, 600);
    }

    function finishProgress() {
        if (progressTimer) clearTimeout(progressTimer);
        bar.style.transition = 'width 150ms ease';
        bar.style.width = '100%';
        setTimeout(function() {
            bar.style.transition = 'none';
            bar.style.width = '0';
        }, 200);
    }

    function swapContent(html, url) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var newMain = doc.getElementById(MAIN_ID);
        if (!newMain) { location.href = url; return; }

        var main = document.getElementById(MAIN_ID);
        if (typeof hideTOC === 'function') hideTOC();

        main.innerHTML = newMain.innerHTML;

        var newTitle = doc.querySelector('title');
        if (newTitle) document.title = newTitle.textContent;

        if (typeof renderContent === 'function') {
            renderContent(main.querySelector('.prose'));
        }
        setTimeout(function() {
            if (typeof initTOC === 'function') initTOC();
            if (typeof initTypewriter === 'function') initTypewriter();
        }, 50);

        main.querySelectorAll('script').forEach(function(old) {
            var s = document.createElement('script');
            if (old.src) s.src = old.src; else s.textContent = old.textContent;
            old.parentNode.replaceChild(s, old);
        });

        finishProgress();
    }

    function navigate(url, push) {
        var ver = ++navVersion;
        if (push) history.pushState({ url: url }, '', url);
        startProgress();
        window.scrollTo({ top: 0, behavior: 'instant' });

        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.setRequestHeader('X-Requested-With', 'polarnav');
        xhr.onload = function() {
            if (ver !== navVersion) return;
            if (xhr.status >= 200 && xhr.status < 400) {
                swapContent(xhr.responseText, url);
            } else {
                location.href = url;
            }
        };
        xhr.onerror = function() {
            if (ver !== navVersion) return;
            location.href = url;
        };
        xhr.send();
    }

    document.addEventListener('click', function(e) {
        var a = e.target.closest('a[href]');
        if (!a || !isNavigable(a)) return;
        var href = a.getAttribute('href');
        if (!href || href.charAt(0) === '#') return;
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        navigate(a.href, true);
    });

    window.addEventListener('popstate', function(e) {
        if (e.state && e.state.url) navigate(e.state.url, false);
        else navigate(location.href, false);
    });

    history.replaceState({ url: location.href }, '');
})();
</script>
</body>
</html>
